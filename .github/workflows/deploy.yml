name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never deploy two builds of the same branch at once; a newer commit wins.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PROJECT_NAME: nekotype

jobs:
  # What the change needs (ADR 097): the files it changes, and on `main` whether this exact tree
  # already passed every check in its pull request. It runs without the container and without
  # `pnpm install`: a few seconds. Whatever it cannot decide is "everything runs".
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only || 'false' }}
      web_e2e: ${{ steps.scope.outputs.web_e2e || 'true' }}
      sync_e2e: ${{ steps.scope.outputs.sync_e2e || 'true' }}
      verified: ${{ steps.verified.outputs.verified || 'false' }}
      tree: ${{ steps.tree.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tree of this commit
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      # A pull request is a merge commit, its first parent is the base; a push is listed from the
      # commit before it, so a push of several commits is judged by all of them.
      - name: Scope of the change
        id: scope
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: node apps/web/scripts/ci-scope.mjs "$BASE" HEAD

      # A pull request run that passed every check it needed leaves the artifact `verified-<tree>`
      # (last step below). The tree of `main` after a squash merge is the same tree when `main` did
      # not move since that run. Only an artifact of a run of this repository counts, never a fork's.
      - name: Did this tree pass its pull request
        id: verified
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.tree.outputs.tree }}
          REPO_ID: ${{ github.event.repository.id }}
        run: |
          found=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=verified-${TREE}&per_page=100" \
            --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == ${REPO_ID})] | length") || found=0
          echo "Artifacts verified-${TREE} of this repository: ${found}"
          if [ "${found:-0}" -gt 0 ]; then echo "verified=true" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: scope
    # Nothing to build or deploy for a change of Markdown files on `main`; a pull request still
    # checks them.
    if: needs.scope.outputs.docs_only != 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A run takes three to five minutes; a step that hangs must not hold the workflow for hours.
    timeout-minutes: 15
    # The job runs in the Playwright image: Chromium, WebKit and their system libraries are in it, so
    # no browser is downloaded and no package is installed per run (ADR 054). The tag must be the
    # version of @playwright/test in pnpm-lock.yaml; a test (app/ci-image.test.ts) checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request is checked out as a merge commit; its first parent is the base, so two
          # commits are enough to list what the pull request changes (latency gate below).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # The workspace belongs to the runner's user and the container runs as root, so git refuses it
      # as "dubious ownership" and `pnpm install` fails in the `prepare` script (`git config`).
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: node -v && pnpm -v

      - run: pnpm install --frozen-lockfile

      # `verify` is these steps (app/ci-scope.test.ts keeps them equal). The browser tests (Chromium
      # and WebKit come with the container image) and the sync tests run on `main` always, and on a
      # pull request when its files can reach them (ADR 097).
      - name: Markdown files only
        if: needs.scope.outputs.docs_only == 'true'
        run: pnpm run format:check && pnpm run docs:check

      # typecheck + lint + Prettier + unit tests with coverage + build + size budget. It produces
      # apps/web/dist, so no second build is needed.
      - name: Verify without the browser tests
        if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.verified != 'true'
        run: pnpm run verify:quick

      # The tree is the one that passed every check in its pull request (ADR 097): the same
      # `dist` is built again for the deployment, and its size budget is checked once more.
      - name: Build of a tree that passed its pull request
        if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.verified == 'true'
        run: pnpm run build && pnpm run budget

      - name: Browser tests
        if: >-
          needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.verified != 'true' &&
          (github.event_name != 'pull_request' || needs.scope.outputs.web_e2e == 'true')
        run: pnpm --filter @nekotype/web exec playwright test

      - name: Sync tests
        if: >-
          needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.verified != 'true' &&
          (github.event_name != 'pull_request' || needs.scope.outputs.sync_e2e == 'true')
        run: pnpm run e2e:sync

      # A failed browser test leaves its trace and page snapshot here; a flaky one cannot be
      # reproduced on a fast machine, so this is the only way to see what the page did.
      - name: Upload the traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # The keystroke latency test takes about two minutes. On `main` and by hand it always runs,
      # before anything is deployed, and a failure stops the workflow before the candidate and
      # production (ADR 052). A pull request runs it only when it changes a file that can move
      # keystroke latency (`apps/web/scripts/latency-gate.mjs`, ADR 074), so a regression shows
      # on the pull request and not after the merge.
      - name: Does this pull request need the latency gate
        id: latency
        if: github.event_name == 'pull_request' && needs.scope.outputs.docs_only != 'true'
        run: node apps/web/scripts/latency-gate.mjs HEAD^1 HEAD

      - name: Keystroke latency gate
        if: >-
          needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.verified != 'true' &&
          (github.event_name != 'pull_request' || steps.latency.outputs.needed == 'true')
        run: pnpm run e2e:latency

      # The branch a build is first deployed to. A pull request has its own preview. A push to main
      # goes to `release-candidate` first, a preview deployment that is not production (ADR 045).
      - name: Resolve branch name
        id: branch
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "name=release-candidate" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # First run only: creates the Pages project. Later runs fail harmlessly.
      - name: Ensure Pages project exists
        if: needs.scope.outputs.docs_only != 'true'
        run: pnpm exec wrangler pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The preview database (`nekotype-preview`) is shared by every pull request and by the
      # `release-candidate` deployment, so a migration is additive and works with the code deployed
      # before it (p5-plan.md, D5). It is applied before the deployment that needs it. Fork PRs have
      # no secrets and skip it, as they skip the deployment.
      - name: Apply D1 migrations (preview)
        if: needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: pnpm exec wrangler d1 migrations apply DB --env preview --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # PRs -> preview deployment with its own URL. Pushes to main -> the `release-candidate`
      # preview first; production comes only after its smoke test passes.
      # Fork PRs have no access to secrets, so they only run the verify job.
      - name: Deploy to Cloudflare Pages
        if: needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: pnpm exec wrangler pages deploy apps/web/dist --project-name="$CLOUDFLARE_PROJECT_NAME" --branch="${{ steps.branch.outputs.name }}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler writes the address of the new deployment here (one JSON object per line).
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson

      # Some behaviour exists only on Cloudflare Pages: a rewrite to /index.html is answered with a
      # 308 (ADR 039), and a missing /assets file must be a real 404 (ADR 037). The dev server and the
      # unit tests cannot show either, so request the deployment itself: every route answers 200
      # with the application, a missing asset and an unknown path answer 404, the bundle loads.
      # It waits for the new deployment to answer first. Falls back to the branch alias if wrangler
      # wrote no address.
      - name: Smoke-test the deployment
        if: needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          ALIAS=$(echo "$BRANCH" | tr 'A-Z/_.' 'a-z---')
          pnpm --filter @nekotype/web exec tsx scripts/smoke-deploy.mjs \
            --wrangler-output "$WRANGLER_OUTPUT_FILE_PATH" \
            --fallback "https://${ALIAS}.${CLOUDFLARE_PROJECT_NAME}.pages.dev"

      # Production is migrated after the candidate passed and before the build that needs the
      # migration goes live. `wrangler d1 migrations apply` records what it applied and takes a
      # backup first.
      - name: Apply D1 migrations (production)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: pnpm exec wrangler d1 migrations apply DB --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The same build, now to production. It was checked on the candidate deployment above; a
      # failed smoke test stops here and production keeps serving the previous build.
      - name: Deploy to production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: pnpm exec wrangler pages deploy apps/web/dist --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output-production.ndjson

      # Production is requested once more: its own deployment can differ from the candidate's.
      - name: Smoke-test production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output-production.ndjson
        run: |
          pnpm --filter @nekotype/web exec tsx scripts/smoke-deploy.mjs \
            --production \
            --wrangler-output "$WRANGLER_OUTPUT_FILE_PATH" \
            --fallback "https://${CLOUDFLARE_PROJECT_NAME}.pages.dev"

      # What a push to `main` looks for (ADR 097): this tree passed every check this run needed.
      # Last, so a failed step above leaves no artifact. A skipped group counts as passed: it was
      # skipped because the files of this change cannot reach it.
      - name: Record the tree as verified
        if: success() && github.event_name == 'pull_request' && needs.scope.outputs.docs_only != 'true'
        run: echo "${{ needs.scope.outputs.tree }}" > verified-tree.txt
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'pull_request' && needs.scope.outputs.docs_only != 'true'
        with:
          name: verified-${{ needs.scope.outputs.tree }}
          path: verified-tree.txt
          retention-days: 14
