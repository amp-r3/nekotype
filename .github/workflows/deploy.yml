name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never deploy two builds of the same branch at once; a newer commit wins.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PROJECT_NAME: nekotype

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A run takes three to five minutes; a step that hangs must not hold the workflow for hours.
    timeout-minutes: 15
    # The job runs in the Playwright image: Chromium, WebKit and their system libraries are in it, so
    # no browser is downloaded and no package is installed per run (ADR 054). The tag must be the
    # version of @playwright/test in pnpm-lock.yaml; a test (app/ci-image.test.ts) checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request is checked out as a merge commit; its first parent is the base, so two
          # commits are enough to list what the pull request changes (latency gate below).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # The workspace belongs to the runner's user and the container runs as root, so git refuses it
      # as "dubious ownership" and `pnpm install` fails in the `prepare` script (`git config`).
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: node -v && pnpm -v

      - run: pnpm install --frozen-lockfile

      # typecheck + lint + Prettier + unit tests with coverage + build + size budget + e2e (Chromium
      # and WebKit come with the container image).
      # `verify` already produces apps/web/dist, so no second build is needed.
      - run: pnpm run verify

      # The keystroke latency test takes about two minutes. On `main` and by hand it always runs,
      # before anything is deployed, and a failure stops the workflow before the candidate and
      # production (ADR 052). A pull request runs it only when it changes a file that can move
      # keystroke latency (`apps/web/scripts/latency-gate.mjs`, ADR 074), so a regression shows
      # on the pull request and not after the merge.
      - name: Does this pull request need the latency gate
        id: latency
        if: github.event_name == 'pull_request'
        run: node apps/web/scripts/latency-gate.mjs HEAD^1 HEAD

      - name: Keystroke latency gate
        if: github.event_name != 'pull_request' || steps.latency.outputs.needed == 'true'
        run: pnpm run e2e:latency

      # The branch a build is first deployed to. A pull request has its own preview. A push to main
      # goes to `release-candidate` first, a preview deployment that is not production (ADR 045).
      - name: Resolve branch name
        id: branch
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "name=release-candidate" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # First run only: creates the Pages project. Later runs fail harmlessly.
      - name: Ensure Pages project exists
        run: pnpm dlx wrangler@4 pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # PRs -> preview deployment with its own URL. Pushes to main -> the `release-candidate`
      # preview first; production comes only after its smoke test passes.
      # Fork PRs have no access to secrets, so they only run the verify job.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm dlx wrangler@4 pages deploy apps/web/dist --project-name="$CLOUDFLARE_PROJECT_NAME" --branch="${{ steps.branch.outputs.name }}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler writes the address of the new deployment here (one JSON object per line).
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson

      # Some behaviour exists only on Cloudflare Pages: a rewrite to /index.html is answered with a
      # 308 (ADR 039), and a missing /assets file must be a real 404 (ADR 037). The dev server and the
      # unit tests cannot show either, so request the deployment itself: every route answers 200
      # with the application, a missing asset and an unknown path answer 404, the bundle loads.
      # It waits for the new deployment to answer first. Falls back to the branch alias if wrangler
      # wrote no address.
      - name: Smoke-test the deployment
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          ALIAS=$(echo "$BRANCH" | tr 'A-Z/_.' 'a-z---')
          pnpm --filter @nekotype/web exec tsx scripts/smoke-deploy.mjs \
            --wrangler-output "$WRANGLER_OUTPUT_FILE_PATH" \
            --fallback "https://${ALIAS}.${CLOUDFLARE_PROJECT_NAME}.pages.dev"

      # The same build, now to production. It was checked on the candidate deployment above; a
      # failed smoke test stops here and production keeps serving the previous build.
      - name: Deploy to production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: pnpm dlx wrangler@4 pages deploy apps/web/dist --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output-production.ndjson

      # Production is requested once more: its own deployment can differ from the candidate's.
      - name: Smoke-test production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output-production.ndjson
        run: |
          pnpm --filter @nekotype/web exec tsx scripts/smoke-deploy.mjs \
            --wrangler-output "$WRANGLER_OUTPUT_FILE_PATH" \
            --fallback "https://${CLOUDFLARE_PROJECT_NAME}.pages.dev"
