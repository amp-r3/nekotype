<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Nekotype</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The static twin of the app's not-found screen (app/route-view.tsx): Cloudflare Pages answers
         unknown paths and missing /assets files with this file and a real 404 (ADR 037, 039, 077).
         Colours are the dark tokens, the strings are notFound.* of shared/i18n, the cat is the
         neutral Cat of shared/ui/cat.tsx; not-found-page.test.ts keeps them equal. -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #1c1e21;
        --fur: #efe9dd;
        --fur-bright: #faf6ef;
        --fur-dim: #b5b1a8;
        --eye: #a5c8dd;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fur);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        max-width: 360px;
        margin: 0 auto;
        padding: 64px 16px;
        text-align: center;
      }
      svg {
        display: block;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0;
        font-size: 17px;
        line-height: 24px;
        font-weight: 500;
      }
      p {
        margin: 0 0 16px;
        color: var(--fur-dim);
        font-size: 15px;
        line-height: 24px;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 16px;
        border-radius: 4px;
        background: var(--fur);
        color: var(--bg);
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
        text-decoration: none;
      }
      a:hover {
        background: var(--fur-bright);
      }
      a:focus-visible {
        outline: 2px solid var(--eye);
        outline-offset: 2px;
      }
      kbd {
        font:
          12px/16px ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main data-page="not-found">
      <!-- The cat's shapes are a brand asset of amp-r3, all rights reserved, and not covered by the
           AGPL (NOTICE.md, BRAND.md). -->
      <svg viewBox="0 0 96 96" width="112" height="112" aria-hidden="true" focusable="false">
        <path
          d="M26 84.5L26 72A22 22 0 0 1 69.79 68.95A4 4 0 0 0 72.92 72.31A14 14 0 0 1 83.96 84.92A1 1 0 0 1 82.96 86L78.94 86A1 1 0 0 1 77.95 85.11A8 8 0 0 0 71.85 78.22A1.5 1.5 0 0 0 70 79.68L70 84.5A1.5 1.5 0 0 1 68.5 86L27.5 86A1.5 1.5 0 0 1 26 84.5Z"
          fill="var(--fur)"
        />
        <circle cx="48" cy="36" r="18" fill="none" stroke="var(--bg)" stroke-width="2.5" />
        <path
          d="M32.33 28.47L29.66 14.47A1.6 1.6 0 0 1 32.04 12.79L42.82 19.13A2.2 2.2 0 0 0 44.4 19.38A17 17 0 0 1 51.6 19.38A2.2 2.2 0 0 0 53.18 19.13L63.96 12.79A1.6 1.6 0 0 1 66.34 14.47L63.67 28.47A2.2 2.2 0 0 0 63.79 29.7A17 17 0 1 1 32.21 29.7A2.2 2.2 0 0 0 32.33 28.47Z"
          fill="var(--fur)"
        />
        <circle cx="41" cy="37" r="3.4" fill="var(--eye)" />
        <rect x="40.3" y="34.7" width="1.4" height="4.6" rx="0.7" fill="var(--bg)" />
        <circle cx="55" cy="37" r="3.4" fill="var(--eye)" />
        <rect x="54.3" y="34.7" width="1.4" height="4.6" rx="0.7" fill="var(--bg)" />
      </svg>
      <h1>
        <span data-lang="en">Page not found</span
        ><span data-lang="ru" hidden>Страница не найдена</span>
      </h1>
      <p>
        <span data-lang="en">There is no such address.</span
        ><span data-lang="ru" hidden>Такого адреса нет.</span>
      </p>
      <a href="/"
        ><span data-lang="en">go home</span><span data-lang="ru" hidden>на главную</span
        ><kbd>enter</kbd></a
      >
    </main>
    <script>
      (function () {
        var lang = 'en';
        try {
          var saved = localStorage.getItem('nekotype:locale');
          if (saved === 'en' || saved === 'ru') lang = saved;
          else if (/^ru/i.test(navigator.language || '')) lang = 'ru';
        } catch (e) {
          if (/^ru/i.test(navigator.language || '')) lang = 'ru';
        }
        document.documentElement.lang = lang;
        var spans = document.querySelectorAll('[data-lang]');
        for (var i = 0; i < spans.length; i++) spans[i].hidden = spans[i].dataset.lang !== lang;
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !(e.target instanceof HTMLAnchorElement)) location.assign('/');
        });
      })();
    </script>
  </body>
</html>
