# The Workers configuration of the API tests (p5-plan.md, D8). It is separate from the Pages
# configuration at the repository root on purpose: the tests must not depend on how the plugin
# reads a Pages file.
name = "nekotype-api-test"
compatibility_date = "2026-11-01"

[vars]
ENVIRONMENT = "test"
APP_ORIGIN = "http://localhost:5173"
SYNC_MIN_INTERVAL_MS = "5000"
# Stand-ins for the OAuth secrets: the tests replace the providers, so the values are never sent.
GOOGLE_CLIENT_ID = "google-client-id"
GOOGLE_CLIENT_SECRET = "google-client-secret"
GITHUB_CLIENT_ID = "github-client-id"
GITHUB_CLIENT_SECRET = "github-client-secret"

[[d1_databases]]
binding = "DB"
database_name = "nekotype-test"
database_id = "00000000-0000-0000-0000-000000000001"
