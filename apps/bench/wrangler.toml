# The measurement project of P5 PR 1 and P7 PR 7 (p5-plan.md, p7-plan.md, M1). Not the application's project.
name = "nekotype-bench"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

[vars]
ENVIRONMENT = "bench"
# The measurement sends requests faster than the interval of the application.
SYNC_MIN_INTERVAL_MS = "0"

[[d1_databases]]
binding = "DB"
database_name = "nekotype-bench"
database_id = "6a5dd4bf-393d-4563-9e0c-1bf36e2e0bd0"
